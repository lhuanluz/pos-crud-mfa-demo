name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, branch or commit SHA to deploy
        required: true
        default: main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    name: Deploy CI-validated revision to Oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Validate deployment key
        env:
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SERVER_SSH_PRIVATE_KEY" || { echo "Missing GitHub Secret: SERVER_SSH_PRIVATE_KEY" >&2; exit 1; }

      - name: Configure ephemeral SSH credentials
        env:
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS'
|1|y8UuPfnWkXQ9IIxPz4a0KXbKazE=|yLX1U0k1Y33Q6dVApiq3LhQ5Y2A= ssh-rsa 
|1|DaoVt6nBelMPnAdbJZtNV431Lzs=|O7SpQiKJrW5JYNlIfHQ/muF06Ds= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCl5YMd/AuQZSGhQ7zdDl1cIxZLINY/9KtOedJgAQvtXbuOt06IbwodBfDXRq8XW30jhdMKUvPfW0MxPfcckX5Q=
|1|0aBokjgUbVQc/9LtbcuvQVnJt+g=|OXnsykY00KPO3b0dGvLHGEFHVP0= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJcaB9TithhblxXQhw2C/sw5DQBV5rXzUwZ5wJer9gmZ
KNOWN_HOSTS
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact validated revision and run health check
        env:
          DEPLOY_REF: ${{ github.event.workflow_run.head_sha || inputs.ref }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p 22 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            ubuntu@147.15.124.129 \
            "APP_PATH=/opt/pos-crud-mfa-demo DEPLOY_REF=$DEPLOY_REF bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          git fetch --prune origin
          git cat-file -e "${DEPLOY_REF}^{commit}"
          git reset --hard "$DEPLOY_REF"
          sudo docker compose -f compose.yml -f compose.host-nginx.yml --env-file .env.docker up -d --build app
          curl -fsS --max-time 15 http://127.0.0.1:3001/api/health
          REMOTE

      - name: Remove ephemeral private key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
