name: CI and production deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Install, lint, test, build and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run security:audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build --pull --no-cache --tag pos-crud-mfa-demo:ci .

  deploy:
    name: Deploy validated revision to Oracle
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Validate deployment key
        env:
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SERVER_SSH_PRIVATE_KEY" || { echo "Missing GitHub Secret: SERVER_SSH_PRIVATE_KEY" >&2; exit 1; }
      - name: Configure ephemeral SSH credentials
        env:
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' \
            '|1|y8UuPfnWkXQ9IIxPz4a0KXbKazE=|yLX1U0k1Y33Q6dVApiq3LhQ5Y2A= ssh-rsa ' \
            '|1|DaoVt6nBelMPnAdbJZtNV431Lzs=|O7SpQiKJrW5JYNlIfHQ/muF06Ds= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCl5YMd/AuQZSGhQ7zdDl1cIxZLINY/9KtOedJgAQvtXbuOt06IbwodBfDXRq8XW30jhdMKUvPfW0MxPfcckX5Q=' \
            '|1|0aBokjgUbVQc/9LtbcuvQVnJt+g=|OXnsykY00KPO3b0dGvLHGEFHVP0= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJcaB9TithhblxXQhw2C/sw5DQBV5rXzUwZ5wJer9gmZ' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verify SSH authentication
        run: |
          set -euo pipefail
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh -i ~/.ssh/deploy_key -p 22 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes ubuntu@147.15.124.129 'printf ssh_auth_ok'
      - name: Deploy exact validated revision and run health check
        env:
          DEPLOY_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p 22 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes ubuntu@147.15.124.129 "APP_PATH=/opt/pos-crud-mfa-demo DEPLOY_REF=$DEPLOY_REF bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          git fetch --prune origin
          git cat-file -e "${DEPLOY_REF}^{commit}"
          git reset --hard "$DEPLOY_REF"
          sudo docker compose -f compose.yml -f compose.host-nginx.yml --env-file .env.docker up -d --build app
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3001/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become healthy within 60 seconds" >&2
          exit 1
          REMOTE
      - name: Remove ephemeral private key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
