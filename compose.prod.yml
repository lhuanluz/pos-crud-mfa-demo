services:
  nginx:
    ports:
      # Production server: expose only HTTP/HTTPS on the Debian/Ubuntu host.
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./deploy/nginx/certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  letsencrypt:
