services:
  app:
    build: .
    image: pos-crud-mfa-demo:local
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /app/data/data.db
    volumes:
      - app_data:/app/data
    expose:
      - "3001"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-bookworm
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Local/dev: only this Mac can access. For the Debian/Ubuntu server, use compose.prod.yml.
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/nginx/conf.d/local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal

volumes:
  app_data:

networks:
  internal:
    driver: bridge
